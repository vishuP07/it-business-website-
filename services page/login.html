<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>login</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<section class="signup-wrapper d-flex align-items-center justify-content-center">

  <div class="signup-card row rounded-4 overflow-hidden">

    <!-- LEFT FORM -->  
   <div class="col-lg-6 col-12 form-side p-3 p-md-4">

  <h3 class="login-title fw-bold "> Hello,<br>Welcome Back</h3>
          <p class="small text-secondary">Hey Welcome back to your special place.</p>


 <form id="signupForm">

  <!-- Phone -->
  <div class="mb-3">
    <label class="form-label text-dark">Phone No</label>
    <input type="text" class="form-control custom-input  " placeholder="👤 Enter phone number">
  </div>

  <!-- Email -->
  <div class="mb-3">
    <label class="form-label text-dark">Email</label>
    <input type="email" class="form-control custom-input" placeholder=" ✉ Enter your email">
  </div>  

  <!-- Password -->
  <div class="mb-3 position-relative">
    <label class="form-label text-dark">Password</label>
    <input type="password" id="password" class="form-control custom-input" placeholder="🔒︎ Enter password">
    
    <!-- Eye Icon -->
    <i class="bi bi-eye-slash toggle-password"></i>
  </div>

  <!-- Remember -->
  <div class="d-flex justify-content-between mb-3">
    <div class="form-check">
      <input class="form-check-input  " type="checkbox">
      <label class="form-check-label text-dark">Remember me</label>
    </div>
    <a href="#">Forgot password?</a>
  </div>
<a href="index.html" class="btn btn-primary w-100 login-btn">
  Log In
</a>
  <!-- Divider -->
<div class="text-center my-3">
  <span class="text-muted small">Or, login with</span>
</div>

<!-- Google Button -->
<a href="https://accounts.google.com" target="_blank" class="btn google-btn w-100 mb-3 border ">
  <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" width="18" class="me-2">
  Sign up with Google
</a>

<!-- Register -->
<p class="text-center small text-dark">
  Don’t have an account?
  <a href="signup.html" class="fw-semibold ">Register here</a>
</p>

</form>

</div>
    <!-- RIGHT SIDE -->
    <div class="col-lg-6 righ-side d-flex align-items-center justify-content-center">
    </div>
  </div>

</section>
  <script src="./js/bootstrap.bundle.min.js"></script>

  <script>
  
  </script>
  </body>
  </html>
