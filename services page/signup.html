<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Signup</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<section class="signup-wrapper d-flex align-items-center justify-content-center">

  <div class="signup-card row rounded-4 overflow-hidden">

    <!-- LEFT FORM -->  
   <div class="col-lg-6 form-side p-4">

  <h3 class="login-title fw-bold "> Hello,<br>Welcome New User</h3>
          <p class="small text-secondary">Create the profile your favourite place.</p>


 <form id="signupForm">

  <!-- Phone -->
  <div class="mb-2">
    <label class="form-label text-dark">User name</label>
    <input type="text" class="form-control custom-input  " placeholder="👤 Enter User Name">
  </div>

  <!-- Email -->
  <div class="mb-2">
    <label class="form-label text-dark">E-Mail</E-mai></label>
    <input type="email" class="form-control custom-input" placeholder="✉ Enter Phone E-mail">
  </div>  
  <!-- Password -->
    <div class="mb-3">
    <label for="password" class="form-label text-dark">Password</label>
    <input type="password" class="form-control" id="password" required placeholder="🔒︎ Enter the password">
  </div>
  <div class="mb-3">
    <label for="confirmPassword" class="form-label text-dark">Confirm Password</label>
    <input type="password" class="form-control text-danger" id="confirmPassword"  required  placeholder="🔐 confirm the password" >
    <div class="invalid-feedback">Passwords do not match.</div>
  </div>

  <a href="login.html" class="btn btn-primary w-100 login-btn my-2">
  Sign Up
</a>
  <!-- Divider -->
<div class="text-center my-3">
  <span class="text-muted small">Or, login with</span>
</div>

<!-- Google Button -->
<a href="https://accounts.google.com" target="_blank" class="btn google-btn w-100 mb-3 border ">
  <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" width="18" class="me-2">
  Sign up with Google
</a>
<!-- already  -->
<p class="text-center small text-dark">
  already have an account?
  <a href="login.html" class="fw-semibold ">login </a>
</p>


</div>
    <!-- RIGHT SIDE -->
    <div class="col-lg-6 righ-side d-flex align-items-center justify-content-center">
    </div>
  </div>

</section>
  <script src="./js/bootstrap.bundle.min.js"></script>

  <script>
  (function () {
    'use strict'
    const form = document.querySelector('.needs-validation')
    const pass = document.getElementById('password')
    const confirmPass = document.getElementById('confirmPassword')

    form.addEventListener('submit', function (event) {
      if (pass.value !== confirmPass.value) {
        confirmPass.setCustomValidity("Not matching");
        event.preventDefault();
        event.stopPropagation();
      } else {
        confirmPass.setCustomValidity("");
      }
      form.classList.add('was-validated')
    }, false)
  })()
</script>
  </body>
  </html>
